    /**
     * Custom Smooth Cursor Component
     */
    const CustomCursor = () => {
      const [position, setPosition] = useState({ x: -100, y: -100 });
      const [cursorType, setCursorType] = useState('default');
      const [isVisible, setIsVisible] = useState(false);

      useEffect(() => {
        if (window.matchMedia("(pointer: coarse)").matches) return;

        const onMouseMove = (e) => {
          setPosition({ x: e.clientX, y: e.clientY });
          if (!isVisible) setIsVisible(true);

          const target = e.target;
          if (target.closest('[data-cursor="view"]')) {
            setCursorType('view');
          } else if (target.closest('[data-cursor="explore"]')) {
            setCursorType('explore');
          } else if (target.closest('a, button, [role="button"]')) {
            setCursorType('hover');
          } else {
            setCursorType('default');
          }
        };

        const onMouseLeave = () => setIsVisible(false);

        window.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseleave', onMouseLeave);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseleave', onMouseLeave);
        };
      }, [isVisible]);

      if (!isVisible) return null;

      return (
        <div 
          className="fixed top-0 left-0 pointer-events-none z-50 transition-transform duration-75 ease-out"
          style={{
            transform: `translate3d(${position.x}px, ${position.y}px, 0)`
          }}
        >
          <div className={`-translate-x-1/2 -translate-y-1/2 flex items-center justify-center rounded-full transition-all duration-300 ${
            cursorType === 'default' ? 'w-3 h-3 bg-[#B79A63]' :
            cursorType === 'hover' ? 'w-10 h-10 border border-[#B79A63] bg-[#B79A63]/10' :
            'w-16 h-16 bg-[#18352B] text-[#F5F1E8] text-[10px] tracking-widest font-sans font-medium uppercase border border-[#B79A63]'
          }`}>
            {cursorType === 'view' && <span>VIEW</span>}
            {cursorType === 'explore' && <span>EXPLORE</span>}
          </div>
        </div>
      );
    };

    /**
     * Curated Archive Carousel Card with Continuous Fluid Infinite Marquee, Edge Fade & Hover Controls
     */
    const ArchiveCarouselCard = ({ item }) => {
      const scrollRef = useRef(null);
      const total = item.images.length;

      // Duplicate list so there are at least 2 identical halves (infinite seamless loop with zero jump)
      const multiplier = Math.max(2, Math.ceil(8 / total) * 2);
      const displayImages = useMemo(() => {
        const arr = [];
        for (let i = 0; i < multiplier; i++) {
          arr.push(...item.images);
        }
        return arr;
      }, [item.images, multiplier]);

      // Total duration for a half-cycle: exactly 1.5s per image
      const halfCount = (displayImages.length) / 2;
      const durationSeconds = Math.max(6, halfCount * 1.5);

      const handlePrev = (e) => {
        e.stopPropagation();
        if (scrollRef.current) {
          scrollRef.current.scrollBy({ left: -280, behavior: 'smooth' });
        }
      };

      const handleNext = (e) => {
        e.stopPropagation();
        if (scrollRef.current) {
          scrollRef.current.scrollBy({ left: 280, behavior: 'smooth' });
        }
      };

      const isRTL = item.direction === 'rtl';

      return (
        <div 
          className="group relative bg-[#18352B]/30 border border-[#A8B3A0]/20 rounded-sm overflow-hidden flex flex-col justify-between hover:border-[#B79A63]/60 transition-all duration-500 shadow-md"
          data-cursor="explore"
        >
          {/* Carousel Viewport with Edge Fade & Container Query for Fluid Responsive Sizing */}
          <div 
            ref={scrollRef}
            className="aspect-square w-full overflow-hidden relative bg-[#171817] select-none"
            style={{ containerType: 'inline-size' }}
          >
            {/* Seamless Infinite Marquee Track: Continuous Fluid Movement */}
            <div 
              className={isRTL ? 'marquee-track-rtl' : 'marquee-track-ltr'}
              style={{
                '--marquee-duration': `${durationSeconds}s`
              }}
            >
              {displayImages.map((imgUrl, imgIdx) => (
                <div 
                  key={imgIdx} 
                  className="h-full flex-shrink-0 relative overflow-hidden"
                  style={{ width: '100cqw', height: '100cqw' }}

                  <img 
                    src={imgUrl} 
                    alt={`${item.title} - ${imgIdx + 1}`} 
                    className="w-full h-full object-cover object-center transition-transform duration-700 group-hover:scale-105"
                    loading="lazy"
                  />
                </div>
              ))}
            </div>

            {/* Edge Blur / Subtle Gradient Vignette for Premium Curated Carousel Look */}
            <div className="absolute inset-0 bg-gradient-to-t from-[#171817]/85 via-transparent to-[#171817]/30 pointer-events-none z-20" />
            <div className="absolute inset-y-0 left-0 w-10 bg-gradient-to-r from-[#171817]/60 to-transparent pointer-events-none z-20" />
            <div className="absolute inset-y-0 right-0 w-10 bg-gradient-to-l from-[#171817]/60 to-transparent pointer-events-none z-20" />

            {/* Semi-Transparent Navigation Arrows (Appear on Hover Only) */}
            {total > 1 && (
              <>
                <button
                  onClick={handlePrev}
                  className="absolute left-2.5 top-1/2 -translate-y-1/2 z-30 w-8 h-8 rounded-full bg-black/50 hover:bg-[#B79A63] text-[#F5F1E8] hover:text-[#171817] border border-[#B79A63]/40 flex items-center justify-center text-xs opacity-0 group-hover:opacity-60 hover:!opacity-100 transition-all duration-300 backdrop-blur-sm shadow-lg cursor-pointer"
                  aria-label="Previous image"

                  ‹

                  onClick={handleNext}

    const wrapSvgText = (text, maxChars = 16) => {
      if (!text) return [''];
      const words = text.split(' ');
      const lines = [];
      let current = [];
      let curLen = 0;
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        if (curLen + w.length + (current.length > 0 ? 1 : 0) <= maxChars) {
          current.push(w);
          curLen += w.length + (current.length > 1 ? 1 : 0);
        } else {
          if (current.length > 0) {
            lines.push(current.join(' '));
          }
          current = [w];
          curLen = w.length;
        }
      }
      if (current.length > 0) {
        lines.push(current.join(' '));
      }
      return lines.slice(0, 3);
    };

        { name: "Discipline Individuali & Autocontrollo", cat: "Resilienza Mentale", exp: "Gestione della concentrazione, della respirazione e della tensione emotiva negli sport individuali (arti marziali, atletica, ginnastica).", items: ["Concentrazione e Gestione dell'Ansia", "Autocontrollo e Disciplina Personale", "Focalizzazione sul Gesto Tecnico", "Resilienza e Accettazione della Sconfitta"] },
        { name: "Ruolo Sociale dello Sport", cat: "Crescita Personale", exp: "Lo sport come strumento primario di socializzazione, benessere psicofisico permanente, cooperazione e sviluppo del senso civico.", items: ["Socializzazione e Spirito di Comunità", "Benessere Psicofisico Globale", "Sviluppo dell'Autostima e del Carattere", "Stile di Vita Attivo e Sano"] }

    };

    /**
     * Helper to retrieve or generate complete concept map with 4-5 keywords and 1-5 generated visuals
     */
    const getConceptMapForTopic = (subject, topic, isItalian) => {
      const title = topic.title || topic;
      const desc = topic.desc || '';
      
      let keywords = [];

      // Check if we have curated data for this specific topic
      if (CURATED_CONCEPT_TOPICS[title]) {
        const raw = CURATED_CONCEPT_TOPICS[title];
        keywords = raw.map((k, idx) => ({
          id: `kw-${idx + 1}`,
          name: k.name,
          category: k.cat,
          coords: [
            { x: 22, y: 26 },
            { x: 78, y: 26 },
            { x: 78, y: 74 },
            { x: 22, y: 74 }
          ][idx % 4],
          explanation: k.exp,
          images: [
            {
              type: idx % 2 === 0 ? 'flow' : 'matrix',
              badge: isItalian ? 'SCHEMA OPERATIVO' : 'OPERATIONAL SCHEMA',
              title: `${k.name}: ${isItalian ? 'Struttura Concettuale' : 'Conceptual Structure'}`,
              caption: isItalian 
                ? `Quadro sintetico dei componenti chiave relativi a ${k.name}.`
                : `Comprehensive breakdown of key parameters relating to ${k.name}.`,
              items: k.items
            },
            {
              type: 'structural',
              badge: isItalian ? 'ANALISI GERARCHICA' : 'HIERARCHICAL ANALYSIS',
              title: `${k.name}: ${isItalian ? 'Livelli di Approfondimento' : 'Depth Layers'}`,
              caption: isItalian
                ? `Progressione metodologica e livelli di apprendimento per ${k.name}.`
                : `Methodological progression and mastery levels for ${k.name}.`,
              items: [
                isItalian ? `Fondamenti di ${k.name}` : `Foundations of ${k.name}`,
                isItalian ? `Applicazione Analitica` : `Analytical Application`,
                isItalian ? `Sintesi e Padronanza` : `Synthesis & Mastery`
              ]
            }
          ]
        }));
      } else {
        // High quality intelligent synthesis for any other topic
        const cleanWords = title.replace(/[^\w\sàèéìòùáéíóú-]/gi, '').split(/\s+/).filter(w => w.length > 2);
        
        const terms = isItalian ? [
          { name: cleanWords.slice(0, 2).join(' ') || "Principi Guida", cat: "Inquadramento Teorico" },
          { name: cleanWords.slice(2, 4).join(' ') || "Metodi di Analisi", cat: "Metodologia & Tecniche" },
          { name: cleanWords.slice(4, 6).join(' ') || "Esecuzione Pratica", cat: "Applicazione Didattica" },
          { name: "Competenze & Sintesi", cat: "Valutazione Critica" }
        ] : [
          { name: cleanWords.slice(0, 2).join(' ') || "Core Principles", cat: "Theoretical Framework" },
          { name: cleanWords.slice(2, 4).join(' ') || "Methodological Tools", cat: "Techniques & Analysis" },
          { name: cleanWords.slice(4, 6).join(' ') || "Applied Execution", cat: "Practical Application" },
          { name: "Critical Synthesis", cat: "Academic Evaluation" }
        ];

        keywords = terms.map((t, idx) => ({
          id: `kw-${idx + 1}`,
          name: t.name,
          category: t.cat,
          coords: [
            { x: 22, y: 26 },
            { x: 78, y: 26 },
            { x: 78, y: 74 },
            { x: 22, y: 74 }
          ][idx % 4],
          explanation: isItalian
            ? `Trattazione approfondita del nucleo tematico "${t.name}" all'interno di "${title}". Questa sezione esamina i presupposti teorici, le procedure operative e gli standard didattici affrontati nel programma di studi.`
            : `Comprehensive breakdown of the thematic core "${t.name}" within "${title}". This section investigates theoretical assumptions, operative procedures, and curricular learning standards.`,
          images: [
            {
              type: idx % 2 === 0 ? 'flow' : 'matrix',
              badge: isItalian ? 'SCHEMA CONCETTUALE' : 'CONCEPTUAL SCHEMA',
              title: `${t.name}: ${isItalian ? 'Articolazione Didattica' : 'Curricular Pipeline'}`,
              caption: isItalian
                ? `Fasi progressive di studio e applicazione relative a ${t.name}.`
                : `Sequential progression of study and empirical application for ${t.name}.`,
              items: isItalian ? [
                `Inquadramento di ${t.name}`,
                `Analisi dei Dati e dei Testi`,
                `Elaborazione e Verifica`,
                `Valutazione dei Risultati`
              ] : [
                `Framework of ${t.name}`,
                `Data & Textual Analysis`,
                `Empirical Validation`,
                `Synthesis & Evaluation`
              ]
            },
            {
              type: 'structural',
              badge: isItalian ? 'STRUTTURA DELLE COMPETENZE' : 'COMPETENCY STRUCTURE',
              title: `${t.name}: ${isItalian ? 'Quadro delle Abilità' : 'Skill Hierarchy'}`,
              caption: isItalian
                ? `Competenze specifiche acquisite attraverso l'approfondimento di ${t.name}.`
                : `Core academic and practical competencies mastered through ${t.name}.`,
              items: isItalian ? [
                `Conoscenza Teorica Rigorosa`,
                `Padronanza Tecnica ed Espressiva`,
                `Autonomia Critica e Problem Solving`
              ] : [
                `Foundational Knowledge`,
                `Technical & Analytical Fluency`,
                `Autonomous Critical Problem Solving`
              ]
            }
          ]
        }));
      }

      return {
        centralTitle: title,
        subjectName: subject.name,
        isItalian: isItalian,
        desc: desc,
        keywords: keywords
      };
    };

                              <div className="flex items-center space-x-2">
                                <span className="text-[11px] font-mono text-[#B79A63] font-semibold">
                                  {dIdx + 1 < 10 ? `0${dIdx + 1}` : dIdx + 1}.
                                </span>
                                <h5 
                                  onClick={() => openConceptMap(modalSubject, item)}
                                  className="font-serif text-lg text-[#F5F1E8] font-medium hover:text-[#B79A63] cursor-pointer transition-colors flex items-center space-x-1.5"
                                  title={activeTab === 'ireland' ? 'Click to open Concept Map' : 'Clicca per aprire la Mappa Concettuale'}
                                >
                                  <span>{item.title}</span>
                                  <span className="text-xs font-mono text-[#B79A63]">↗</span>
                                </h5>
                              </div>

                              {/* Button to open Concept Map & Generated Schematics */}
                              <button
                                onClick={() => openConceptMap(modalSubject, item)}
                                className="inline-flex items-center space-x-1.5 px-3 py-1.5 bg-[#B79A63]/20 hover:bg-[#B79A63] text-[#F5F1E8] hover:text-[#171817] border border-[#B79A63]/60 rounded-sm text-[11px] font-mono uppercase tracking-wider transition-colors shadow self-start sm:self-auto"
                              >
                                <span>🗺️</span>
                                <span>{activeTab === 'ireland' ? 'Concept Map & Schematics' : 'Mappa Concettuale & Schemi'}</span>
                                <span>&rarr;</span>
                              </button>
                            </div>

                            <p className="text-xs md:text-sm font-sans text-[#E7E9E3]/85 leading-relaxed pl-4 border-l-2 border-[#B79A63]/40">
                              {item.desc}
                            </p>
                          </div>
                        ))}
                      </div>

                      {/* Quick Return Button */}
                      <div className="pt-2 flex justify-between items-center border-t border-[#A8B3A0]/20 text-xs font-mono">
                        <button
                          onClick={() => setModalViewMode('overview')}
                          className="text-[#B79A63] hover:underline"
                        >
                          &larr; {activeTab === 'ireland' ? 'Back to Subject Card' : 'Torna alla Scheda Materia'}
                        </button>
                        <span className="text-[#A8B3A0]">
                          {modalSubject.detailedTopics ? `${modalSubject.detailedTopics.length} ${activeTab === 'ireland' ? 'Topics Explained' : 'Argomenti Trattati'}` : ''}
                        </span>
                      </div>
                    </div>
                  )}

                </div>

                {/* Modal Footer */}
                <div className="px-6 py-4 bg-[#171817]/90 border-t border-[#A8B3A0]/20 flex justify-between items-center text-[10px] font-mono text-[#A8B3A0] shrink-0">
                  <span>{activeTab === 'ireland' ? 'ACADEMIC ARCHIVE · ST. LOUIS' : 'ARCHIVIO DIDATTICO · GRAFICA E COMUNICAZIONE'}</span>
                  <button 
                    onClick={() => setModalSubject(null)}
                    className="text-[#B79A63] hover:underline uppercase tracking-wider font-semibold"
                  >
                    {activeTab === 'ireland' ? 'CLOSE [✕]' : 'CHIUDI [✕]'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==================================================================== */}
          {/* OVERLAY: INTERACTIVE CONCEPT MAP & KEYWORD SCHEMATICS DRAWER         */}
          {/* ==================================================================== */}
          {conceptMapData && (
            <TopicConceptMapModal 
              mapData={conceptMapData} 
              onClose={() => setConceptMapData(null)} 
            />
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<IrishYearExperience />);
  </script>
</body>
</html>
